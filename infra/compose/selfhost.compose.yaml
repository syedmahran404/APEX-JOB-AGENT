# APEX JOB AGENT — single-tenant self-hosted stack.
#
# Differences from dev.compose.yaml (audit fix F1):
#   - Vault runs in PRODUCTION MODE with file storage. Operator manages unseal
#     keys; auto-unseal via local KMS file or a passphrase-encrypted operator key.
#   - All secrets read from a host-side ./secrets/ directory; no defaults.
#   - Application services are containerized; no host-side `pnpm dev`.
#
# Operator quickstart:
#   1. mkdir -p ./secrets ./vault-data ./pgdata ./miniodata
#   2. Place rotation-managed secrets in ./secrets/ (see docs/runbooks/selfhost.md).
#   3. docker compose -f infra/compose/selfhost.compose.yaml up -d

name: apex-selfhost

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER_FILE: /run/secrets/pg_user
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_password
      POSTGRES_DB: apex
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    secrets:
      - pg_user
      - pg_password
    volumes:
      - apex_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$(cat /run/secrets/pg_user) -d apex"]
      interval: 10s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command:
      [
        "redis-server",
        "--appendonly", "yes",
        "--save", "",
        "--maxmemory-policy", "noeviction",
        "--requirepass-file", "/run/secrets/redis_password",
      ]
    secrets:
      - redis_password
    volumes:
      - apex_redisdata:/data

  minio:
    image: minio/minio:RELEASE.2024-09-22T00-33-43Z
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER_FILE: /run/secrets/minio_user
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/minio_password
    secrets:
      - minio_user
      - minio_password
    volumes:
      - apex_miniodata:/data

  vault:
    image: hashicorp/vault:1.17
    restart: unless-stopped
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_LOCAL_CONFIG: |
        ui = true
        listener "tcp" {
          address     = "0.0.0.0:8200"
          tls_disable = "true"
        }
        storage "file" {
          path = "/vault/data"
        }
        api_addr = "http://vault:8200"
        cluster_addr = "http://vault:8201"
        disable_mlock = false
    command: ["server"]
    volumes:
      - ./vault-data:/vault/data
    # Initial unseal/init must be performed by the operator on first boot:
    #   docker exec -it <container> vault operator init
    #   docker exec -it <container> vault operator unseal <share>

volumes:
  apex_pgdata:
  apex_redisdata:
  apex_miniodata:

secrets:
  pg_user:
    file: ./secrets/pg_user
  pg_password:
    file: ./secrets/pg_password
  redis_password:
    file: ./secrets/redis_password
  minio_user:
    file: ./secrets/minio_user
  minio_password:
    file: ./secrets/minio_password
