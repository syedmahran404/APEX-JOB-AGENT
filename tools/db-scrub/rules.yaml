# db-scrub rules — every column on every table is enumerated with an explicit
# scrub strategy. CI verifies new columns gain entries here before they ship.
# Phase 8 §15 (audit fix H4): fail-closed; missing entry blocks the migration.
#
# Strategies:
#   keep    — copy as-is (non-PII).
#   drop    — replace with NULL or empty default.
#   hash    — replace with SHA-256 of the value (deterministic, irreversible).
#   fake    — synthesize a plausible value (uses faker; deterministic by row id).
#
# This file is checked by `pnpm scrub:check`. Adding a column to schema.prisma
# without a corresponding entry here fails CI.

version: 1

